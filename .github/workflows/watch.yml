name: RTX 5060 Ti 8G Price Watch

on:
  schedule:
    - cron: '2-57/5 * * * *'

  workflow_dispatch:
    inputs:
      test_notify:
        description: '只测试飞书通知'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: rtx-5060ti-price-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check price and notify
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          SMZDM_COOKIE: ${{ secrets.SMZDM_COOKIE }}
          JD_COOKIE: ${{ secrets.JD_COOKIE }}
          TEST_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notify && '1' || '0' }}
        run: python watch.py
